# Local Slipstream stack.
#
#   Kafka        localhost:29092   docs + identity topics
#   Redis        localhost:6379    permission graph, dedup keys, cursors, live feed
#   OpenSearch   localhost:9200    the search index (security plugin off: local only)
#   Prometheus   localhost:9090
#   Grafana      localhost:3000    anonymous admin, local only
#
# Every credential here is a local dev default. Do not reuse them anywhere.

name: slipstream

# Shared settings for Go services. Only one service (indexer1) carries the
# build section; every other service runs the same slipstream:local image.
x-ss: &ss
  image: slipstream:local
  pull_policy: never
  restart: unless-stopped
  environment: &ss-env
    SS_KAFKA_BROKERS: kafka:9092
    SS_REDIS_ADDR: redis:6379
    SS_OPENSEARCH_URL: http://opensearch:9200
    SS_LOG_LEVEL: info

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: ss-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:8.8-alpine
    container_name: ss-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: ss-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ss-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: ss-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Two indexer instances share both consumer groups, so partitions spread
  # across them and a crash or rebalance is exercised all the time.
  indexer1: &indexer
    <<: *ss
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-indexer1
    command: ["indexer"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    environment:
      <<: *ss-env
      SS_METRICS_ADDR: ":9101"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9101/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  indexer2:
    <<: *indexer
    container_name: ss-indexer2
    build: !reset null

  # Simulated identity provider: users, teams, grants. Source of truth for
  # permissions and the leak oracle.
  directory:
    <<: *ss
    container_name: ss-directory
    command: ["directory"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      <<: *ss-env
      SS_DIRECTORY_DB: /data/directory.db
    ports:
      - "8081:8081"
    volumes:
      - directory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *ss
    container_name: ss-api
    command: ["api"]
    depends_on:
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      directory: { condition: service_healthy }
    environment:
      <<: *ss-env
      SS_DIRECTORY_URL: http://directory:8081
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  directory-data:
  kafka-data:
  redis-data:
  opensearch-data:
  prometheus-data:
  grafana-data:
