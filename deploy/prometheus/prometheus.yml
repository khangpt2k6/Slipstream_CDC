# Prometheus scrape config for the Slipstream stack. Every service serves
# /metrics on its ops port and is reached by compose service name.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: indexer
    static_configs:
      - targets: ["indexer1:9101", "indexer2:9101"]

  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: services
    static_configs:
      - targets:
          - directory:8081
          - slacksim:8082
          - connector-slack:8083
          - connector-github:8084
          - connector-jira:8085
          - embedder:8086
